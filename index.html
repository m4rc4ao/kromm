<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario de matricula</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="geral">
        <h2 class="titulo">login</h2>
        <br>
        <div class="log">
            <div class="matricula">
                <form>
                    <label for="fname">Nome:</label>
                    <br>
                    <input type="text" id="fname" name="fname">
                </form>        
            </div>
            <br>
            <div class="matricula">
                <form>
                    <label for="lname">matricula:</label>
                    <br>
                    <input type="text" id="lname" name="lname">
                </form>
            </div>
            <div class="semconta">
                <h3>não tem conta? <a href="#">criar uma</a></h3>
            </div>
            <br>
            <button class="botao">confirmar</button>
        </div>
    </div>
</body>
</html>
